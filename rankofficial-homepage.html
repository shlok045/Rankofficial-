<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>rankofficial — homepage prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0d10;
    --bg-raised: #141519;
    --card: #1a1b20;
    --card-2: #1f2025;
    --border: rgba(255,255,255,0.08);
    --border-soft: rgba(255,255,255,0.05);
    --text-1: #f2f1ec;
    --text-2: #a3a3aa;
    --text-3: #6c6c74;
    --accent: #d4a657;
    --accent-soft: rgba(212,166,87,0.14);
    --accent-line: rgba(212,166,87,0.35);
    --poster-a: #232429;
    --poster-b: #2b2c32;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }

  html{ background: var(--bg); }

  body{
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 84px;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }

  .app{
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  @media (min-width: 900px){
    .app{ max-width: 720px; }
  }
  @media (min-width: 1200px){
    .app{ max-width: 960px; }
  }

  /* ---------- HEADER ---------- */
  header.top{
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(12,13,16,0.86);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }

  .logo{
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }
  .logo .mark{
    width: 7px; height: 7px;
    border-radius: 2px;
    background: var(--accent);
    display: inline-block;
    transform: rotate(45deg);
  }

  /* ---------- SECTIONS ---------- */
  .section{ padding: 26px 0 4px; }
  .section-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 18px;
    margin-bottom: 13px;
  }
  .section-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }
  .see-all{
    font-size: 12px;
    font-weight: 500;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .see-all:active{ color: var(--accent); }

  .head-with-toggle{
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 18px;
    margin-bottom: 13px;
  }
  .head-row{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .toggle{
    display: inline-flex;
    padding: 3px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    width: fit-content;
    position: relative;
  }
  .toggle button{
    position: relative;
    z-index: 2;
    padding: 6px 16px;
    font-size: 12.5px;
    font-weight: 500;
    border-radius: 999px;
    color: var(--text-3);
    transition: color 0.25s ease;
  }
  .toggle button.active{ color: #16130b; }
  .toggle .slider{
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 3px);
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.28s cubic-bezier(.65,0,.35,1);
    z-index: 1;
  }
  .toggle button.shows-active ~ .slider{ transform: translateX(100%); }

  /* ---------- POSTER ROWS ---------- */
  .rail{
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 2px 18px 6px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar{ display: none; }
  .rail::after{ content: ""; flex: 0 0 6px; }

  .poster{
    display: block;
    flex: 0 0 auto;
    width: 108px;
    aspect-ratio: 2 / 3;
    border-radius: var(--radius-sm);
    background: linear-gradient(150deg, var(--poster-b), var(--poster-a) 65%);
    border: 1px solid var(--border-soft);
    scroll-snap-align: start;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 900px){ .poster{ width: 128px; } }

  .poster::before{
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(200deg, rgba(255,255,255,0.045), transparent 45%);
  }

  .poster.ranked .rank-num{
    position: absolute;
    top: 6px; left: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: rgba(242,241,236,0.55);
    letter-spacing: 0.02em;
  }
  .poster.ranked.top3 .rank-num{ color: var(--accent); }

  /* ---------- COMMUNITY CARDS ---------- */
  .community-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 18px;
  }
  .review-card{
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 13px 14px;
  }
  .review-top{
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 9px;
  }
  .avatar{
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    flex-shrink: 0;
  }
  .review-meta{ flex: 1; min-width: 0; }
  .username{
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-1);
  }
  .review-title{
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rating-chip{
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .review-text{
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .review-actions{
    display: flex;
    gap: 16px;
  }
  .review-actions span{
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--text-3);
    font-weight: 500;
  }
  .review-actions svg{ width: 13px; height: 13px; stroke: var(--text-3); }

  /* ---------- GENRE BLOCKS ---------- */
  .genre-block{ padding: 16px 0 0; }
  .genre-block:first-of-type{ padding-top: 4px; }

  /* ---------- FINAL POPULAR ---------- */
  .popular-strip{
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 18px 4px;
    scrollbar-width: none;
  }
  .popular-strip::-webkit-scrollbar{ display: none; }
  .popular-strip .poster{ width: 82px; }

  .divider{
    height: 1px;
    background: var(--border-soft);
    margin: 8px 18px 0;
  }

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 50;
    background: rgba(15,16,19,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-soft);
  }
  .bottom-inner{
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  @media (min-width: 900px){ .bottom-inner{ max-width: 720px; } }
  @media (min-width: 1200px){ .bottom-inner{ max-width: 960px; } }

  .nav-item{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0 4px;
    color: var(--text-3);
  }
  .nav-item svg{ width: 21px; height: 21px; stroke: var(--text-3); stroke-width: 1.7; fill: none; }
  .nav-item span{ font-size: 10.5px; font-weight: 500; }
  .nav-item.active{ color: var(--accent); }
  .nav-item.active svg{ stroke: var(--accent); }
  .nav-item.active .dot{
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--accent);
    margin-top: 1px;
  }
  .nav-item .dot{ width: 3px; height: 3px; margin-top: 1px; }

  .hero-space{ height: 4px; }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="logo"><span class="mark"></span>rankofficial</div>
  </header>

  <div class="hero-space"></div>

  <!-- SECTION 1: ONGOING -->
  <section class="section" id="ongoing">
    <div class="section-head">
      <div class="section-title">Currently Ongoing</div>
      <a class="see-all" href="rankofficial-discover.html#trending">See all →</a>
    </div>
    <div class="rail" id="rail-ongoing"></div>
  </section>

  <!-- SECTION 2: TOP RATED -->
  <section class="section" id="top-rated">
    <div class="section-head">
      <div class="section-title">Top Rated</div>
      <a class="see-all" href="rankofficial-discover.html#top-rated">See all →</a>
    </div>
    <div class="rail" id="rail-rated"></div>
  </section>

  <!-- SECTION 3: COMMUNITY -->
  <section class="section">
    <div class="section-head">
      <div class="section-title">From the Community</div>
      <a class="see-all" href="#">View all →</a>
    </div>
    <div class="community-list" id="community-list"></div>
  </section>

  <!-- SECTION 4: BROWSE BY GENRE -->
  <section class="section" id="genre-section">
    <div class="section-head" style="margin-bottom: 2px;">
      <div class="section-title">Browse by Genre</div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- SECTION 5: FINAL COMMUNITY DISCOVERY -->
  <section class="section">
    <div class="section-head">
      <div class="section-title" style="font-size:15px;">What's Popular With the Community</div>
    </div>
    <div class="popular-strip" id="rail-popular"></div>
  </section>

</div>

<nav class="bottom">
  <div class="bottom-inner">
    <a class="nav-item active" href="rankofficial-homepage.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Home</span>
      <div class="dot"></div>
    </a>
    <a class="nav-item" href="rankofficial-discover.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-4 2-2 4 4-2 2-4z"/></svg>
      <span>Discover</span>
    </a>
    <a class="nav-item" href="rankofficial-library.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9a2 2 0 0 1 2 2v16l-6.5-4L4 21V5a2 2 0 0 1 2-2z"/></svg>
      <span>Library</span>
    </a>
    <a class="nav-item" href="rankofficial-profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6"/></svg>
      <span>Profile</span>
    </a>
  </div>
</nav>

<script>
  function makeRail(container, count, opts={}){
    const el = document.getElementById(container);
    for(let i=1;i<=count;i++){
      const p = document.createElement('a');
      p.href = 'rankofficial-title.html';
      p.className = 'poster' + (opts.ranked ? ' ranked' + (i<=3 ? ' top3' : '') : '');
      if(opts.ranked){
        const n = document.createElement('div');
        n.className = 'rank-num';
        n.textContent = '#' + i;
        p.appendChild(n);
      }
      el.appendChild(p);
    }
  }

  makeRail('rail-ongoing', 9);
  makeRail('rail-rated', 10, { ranked: true });
  makeRail('rail-popular', 7);

  // Genre sections
  const genres = ['Action','Romance','Drama','Fantasy','Comedy'];
  const genreSection = document.getElementById('genre-section');
  genres.forEach((g, idx) => {
    const block = document.createElement('div');
    block.className = 'genre-block';
    const railId = 'rail-genre-' + idx;
    block.innerHTML = `
      <div class="section-head" style="margin-bottom:11px;">
        <div class="section-title" style="font-size:14.5px; font-weight:500; color: var(--text-1);">${g}</div>
        <a class="see-all" href="rankofficial-discover.html#genres">See all →</a>
      </div>
      <div class="rail" id="${railId}"></div>
    `;
    genreSection.appendChild(block);
    makeRail(railId, 9);
  });

  // Community review cards
  const reviews = [
    { user: 'kaidoscope', title: 'Ashfall Requiem', rating: '9/10', text: 'The pacing in the back half completely reframes the first arc — rewatched it twice already.', likes: 214, comments: 38 },
    { user: 'mvrasch', title: 'Low Tide City', rating: '7/10', text: 'Strong ensemble cast but the finale wraps things up a little too neatly for my taste.', likes: 96, comments: 12 },
    { user: 'nell.does.reviews', title: 'Paper Moth Season', rating: '10/10', text: 'Quietly devastating. The score alone deserves its own separate ranking honestly.', likes: 341, comments: 57 },
    { user: 'ordinary_orbit', title: 'The Long Recess', rating: '8/10', text: 'A slow burn that rewards patience — episode six is where it really clicks.', likes: 128, comments: 21 }
  ];
  const list = document.getElementById('community-list');
  reviews.forEach(r => {
    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML = `
      <div class="review-top">
        <div class="avatar"></div>
        <div class="review-meta">
          <div class="username">${r.user}</div>
          <div class="review-title">${r.title}</div>
        </div>
        <div class="rating-chip">${r.rating}</div>
      </div>
      <div class="review-text">${r.text}</div>
      <div class="review-actions">
        <span><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-1 1v7H5a2 2 0 0 0-2 2l1.5 8a2 2 0 0 0 2 1.6H17a2 2 0 0 0 2-1.7l1-6A2 2 0 0 0 18 11h-4z"/></svg>${r.likes}</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.5 9 9 0 0 1-3.8-.8L3 21l1.8-5.3A8.4 8.4 0 0 1 12.5 3a8.4 8.4 0 0 1 8.5 8.5z"/></svg>${r.comments}</span>
      </div>
    `;
    list.appendChild(card);
  });

</script>
</body>
</html>
