<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Discover — rankofficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0d10;
    --bg-raised: #141519;
    --card: #1a1b20;
    --card-2: #1f2025;
    --border: rgba(255,255,255,0.08);
    --border-soft: rgba(255,255,255,0.05);
    --text-1: #f2f1ec;
    --text-2: #a3a3aa;
    --text-3: #6c6c74;
    --accent: #d4a657;
    --accent-soft: rgba(212,166,87,0.14);
    --accent-line: rgba(212,166,87,0.35);
    --poster-a: #232429;
    --poster-b: #2b2c32;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html{ background: var(--bg); }
  body{
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 84px;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }

  .app{ max-width: 560px; margin: 0 auto; position: relative; }
  @media (min-width: 900px){ .app{ max-width: 720px; } }
  @media (min-width: 1200px){ .app{ max-width: 960px; } }

  /* ---------- HEADER ---------- */
  header.top{
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(12,13,16,0.86);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .logo{
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-display); font-weight: 600; font-size: 19px;
    letter-spacing: -0.01em; color: var(--text-1);
  }
  .logo .mark{ width: 7px; height: 7px; border-radius: 2px; background: var(--accent); display: inline-block; transform: rotate(45deg); }

  .page-head{ padding: 18px 18px 4px; }
  .page-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
  }

  /* ---------- SEARCH ---------- */
  .search-wrap{ padding: 14px 18px 6px; }
  .search-bar{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .search-bar svg{ width: 17px; height: 17px; stroke: var(--text-3); flex-shrink: 0; }
  .search-bar input{
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-1);
    font-family: var(--font-body);
    font-size: 14px;
  }
  .search-bar input::placeholder{ color: var(--text-3); }

  /* ---------- SECTIONS ---------- */
  .section{ padding: 24px 0 4px; }
  .section-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 18px;
    margin-bottom: 13px;
  }
  .section-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }
  .see-all{
    font-size: 12px;
    font-weight: 500;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .see-all:active{ color: var(--accent); }

  /* ---------- RAIL / POSTERS ---------- */
  .rail{
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 2px 18px 6px;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar{ display: none; }
  .rail::after{ content: ""; flex: 0 0 6px; }

  .poster{
    display: block;
    flex: 0 0 auto;
    width: 108px;
    aspect-ratio: 2 / 3;
    border-radius: var(--radius-sm);
    background: linear-gradient(150deg, var(--poster-b), var(--poster-a) 65%);
    border: 1px solid var(--border-soft);
    scroll-snap-align: start;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 900px){ .poster{ width: 128px; } }
  .poster::before{
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(200deg, rgba(255,255,255,0.045), transparent 45%);
  }
  .poster.ranked .rank-num{
    position: absolute;
    top: 6px; left: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: rgba(242,241,236,0.55);
    letter-spacing: 0.02em;
  }
  .poster.ranked.top3 .rank-num{ color: var(--accent); }

  /* ---------- GENRE SELECT GRID ---------- */
  .genre-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 0 18px;
  }
  @media (min-width: 640px){ .genre-grid{ grid-template-columns: repeat(3, 1fr); } }

  .genre-select-card{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    position: relative;
    overflow: hidden;
  }
  .genre-select-card::before{
    content: "";
    position: absolute;
    top: -20px; right: -20px;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: var(--accent-soft);
    opacity: 0.5;
  }
  .genre-select-card span{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    color: var(--text-1);
    z-index: 1;
  }
  .genre-select-card svg{
    width: 14px; height: 14px;
    stroke: var(--text-3);
    z-index: 1;
  }

  /* ---------- RANDOM PICK ---------- */
  .random-card{
    margin: 0 18px;
    padding: 22px 18px;
    background: var(--card);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-lg);
    text-align: center;
  }
  .random-card p{
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 14px;
  }
  .random-btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--accent);
    color: #16130b;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 999px;
  }

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom{
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: rgba(15,16,19,0.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-soft);
  }
  .bottom-inner{ max-width: 560px; margin: 0 auto; display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px){ .bottom-inner{ max-width: 720px; } }
  @media (min-width: 1200px){ .bottom-inner{ max-width: 960px; } }
  .nav-item{ flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; color: var(--text-3); }
  .nav-item svg{ width: 21px; height: 21px; stroke: var(--text-3); stroke-width: 1.7; fill: none; }
  .nav-item span{ font-size: 10.5px; font-weight: 500; }
  .nav-item.active{ color: var(--accent); }
  .nav-item.active svg{ stroke: var(--accent); }
  .nav-item .dot{ width: 3px; height: 3px; margin-top: 1px; border-radius: 50%; }
  .nav-item.active .dot{ background: var(--accent); }
  /* ---------- SEARCH RESULTS ---------- */

.search-wrap{
  position: relative;
  z-index: 30;
}

.search-bar{
  transition: border-color 0.2s ease, background 0.2s ease;
}

.search-bar:focus-within{
  border-color: var(--accent-line);
  background: var(--card);
}

.search-results{
  display: none;
  margin: 8px 18px 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: 0 18px 45px rgba(0,0,0,0.35);
}

.search-results.visible{
  display: block;
}

.search-result{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-bottom: 1px solid var(--border-soft);
  transition: background 0.15s ease;
}

.search-result:last-child{
  border-bottom: none;
}

.search-result:hover,
.search-result:active{
  background: var(--card-2);
}

.search-result-poster{
  width: 48px;
  height: 68px;
  flex: 0 0 48px;
  border-radius: 7px;
  object-fit: cover;
  background: linear-gradient(
    150deg,
    var(--poster-b),
    var(--poster-a)
  );
}

.search-result-info{
  min-width: 0;
  flex: 1;
}

.search-result-title{
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--text-1);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.search-result-meta{
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-3);
}

.search-result-score{
  color: var(--accent);
  font-family: var(--font-mono);
  font-weight: 600;
}

.search-result-genres{
  margin-top: 5px;
  font-size: 10px;
  color: var(--text-3);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.search-result-arrow{
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  stroke: var(--text-3);
}

.search-status{
  padding: 18px;
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
}

.search-status.error{
  color: #c87878;
}

.search-status strong{
  display: block;
  color: var(--text-2);
  font-size: 13px;
  margin-bottom: 4px;
}

@media (min-width: 640px){
  .search-results{
    margin-left: 18px;
    margin-right: 18px;
  }

  .search-result-poster{
    width: 52px;
    height: 74px;
    flex-basis: 52px;
  }
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="logo"><span class="mark"></span>rankofficial</div>
  </header>

  <div class="page-head">
    <div class="page-title">Discover</div>
  </div>

  <div class="search-wrap">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search anime...">
    </div>
  </div>
  <div class="search-results" id="search-results"></div>

  <!-- TRENDING -->
  <section class="section" id="trending">
    <div class="section-head">
      <div class="section-title">Trending</div>
      <a class="see-all" href="#">See all →</a>
    </div>
    <div class="rail" id="rail-trending"></div>
  </section>

  <!-- TOP RATED -->
  <section class="section" id="top-rated">
    <div class="section-head">
      <div class="section-title">Top Rated</div>
      <a class="see-all" href="#">See all →</a>
    </div>
    <div class="rail" id="rail-rated"></div>
  </section>

  <!-- POPULAR THIS WEEK -->
  <section class="section" id="popular">
    <div class="section-head">
      <div class="section-title">Popular This Week</div>
      <a class="see-all" href="#">See all →</a>
    </div>
    <div class="rail" id="rail-popular"></div>
  </section>

  <!-- BROWSE BY GENRE -->
  <section class="section" id="genres">
    <div class="section-head">
      <div class="section-title">Browse by Genre</div>
    </div>
    <div class="genre-grid" id="genre-grid"></div>
  </section>

  <!-- CAN'T DECIDE -->
  <section class="section">
    <div class="section-head">
      <div class="section-title" style="font-size:15px;">Can't decide what to watch?</div>
    </div>
    <div class="random-card">
      <p>Let us pick something from your watchlist for you.</p>
      <button class="random-btn">🎲 Random Pick</button>
    </div>
  </section>

</div>

<nav class="bottom">
  <div class="bottom-inner">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Home</span>
      <div class="dot"></div>
    </a>
    <a class="nav-item active" href="discover.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-4 2-2 4 4-2 2-4z"/></svg>
      <span>Discover</span>
      <div class="dot"></div>
    </a>
    <a class="nav-item" href="library.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9a2 2 0 0 1 2 2v16l-6.5-4L4 21V5a2 2 0 0 1 2-2z"/></svg>
      <span>Library</span>
      <div class="dot"></div>
    </a>
    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6"/></svg>
      <span>Profile</span>
      <div class="dot"></div>
    </a>
  </div>
</nav>

<script>
  function makeRail(container, count, opts = {}) {
    const el = document.getElementById(container);

    for (let i = 1; i <= count; i++) {
      const p = document.createElement('a');

      p.href = 'title.html';
      p.className =
        'poster' +
        (opts.ranked ? ' ranked' + (i <= 3 ? ' top3' : '') : '');

      if (opts.ranked) {
        const n = document.createElement('div');
        n.className = 'rank-num';
        n.textContent = '#' + i;
        p.appendChild(n);
      }

      el.appendChild(p);
    }
  }

  // Initial placeholder rails
  makeRail('rail-trending', 10);
  makeRail('rail-rated', 10, { ranked: true });
  makeRail('rail-popular', 9);

  // Genres
  const genres = ['Action', 'Romance', 'Drama', 'Fantasy', 'Comedy'];
  const genreGrid = document.getElementById('genre-grid');

  genres.forEach(g => {
    const card = document.createElement('a');

    card.className = 'genre-select-card';
    card.href = '#';

    card.innerHTML = `
      <span>${g}</span>
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor"
           stroke-linecap="round"
           stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    `;

    genreGrid.appendChild(card);
  });


  // =========================
  // ANIME SEARCH
  // =========================

  const searchInput = document.getElementById('anime-search');

  const searchResults = document.createElement('section');
  searchResults.className = 'section';
  searchResults.id = 'search-results';

  searchResults.innerHTML = `
    <div class="section-head">
      <div class="section-title">Search Results</div>
    </div>

    <div class="rail" id="rail-search"></div>
  `;

  const searchWrap = document.querySelector('.search-wrap');
  searchWrap.insertAdjacentElement('afterend', searchResults);

  const searchRail = document.getElementById('rail-search');

  searchResults.style.display = 'none';


  let searchTimer;


  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);

    const query = searchInput.value.trim();

    if (!query) {
      searchResults.style.display = 'none';
      searchRail.innerHTML = '';
      return;
    }

    searchTimer = setTimeout(() => {
      searchAnime(query);
    }, 400);
  });


  async function searchAnime(query) {

    searchResults.style.display = 'block';

    searchRail.innerHTML = `
      <div style="
        padding: 20px 18px;
        color: var(--text-3);
        font-size: 13px;
      ">
        Searching...
      </div>
    `;

    try {

      const response = await fetch(
        '/api/anime/search?q=' + encodeURIComponent(query)
      );

      if (!response.ok) {
        throw new Error('Search request failed');
      }

      const data = await response.json();

      searchRail.innerHTML = '';

      if (!data.data || data.data.length === 0) {

        searchRail.innerHTML = `
          <div style="
            padding: 20px 18px;
            color: var(--text-3);
            font-size: 13px;
          ">
            No anime found.
          </div>
        `;

        return;
      }


      data.data.forEach(item => {

        const anime = item.node;

        const poster = document.createElement('a');

        poster.className = 'poster';
        poster.href = 'title.html?id=' + anime.id;

        if (anime.main_picture) {

          poster.style.backgroundImage =
            `url("${anime.main_picture.large || anime.main_picture.medium}")`;

          poster.style.backgroundSize = 'cover';
          poster.style.backgroundPosition = 'center';
        }

        poster.title = anime.title;

        searchRail.appendChild(poster);

      });

    } catch (error) {

      console.error(error);

      searchRail.innerHTML = `
        <div style="
          padding: 20px 18px;
          color: var(--text-3);
          font-size: 13px;
        ">
          Something went wrong. Please try again.
        </div>
      `;
    }
  }
</script>

</body>
</html>
