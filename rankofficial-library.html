<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Library — rankofficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0d10;
    --bg-raised: #141519;
    --card: #1a1b20;
    --card-2: #1f2025;
    --border: rgba(255,255,255,0.08);
    --border-soft: rgba(255,255,255,0.05);
    --text-1: #f2f1ec;
    --text-2: #a3a3aa;
    --text-3: #6c6c74;
    --accent: #d4a657;
    --accent-soft: rgba(212,166,87,0.14);
    --accent-line: rgba(212,166,87,0.35);
    --poster-a: #232429;
    --poster-b: #2b2c32;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html{ background: var(--bg); }
  body{
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 84px;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }

  .app{ max-width: 560px; margin: 0 auto; position: relative; }
  @media (min-width: 900px){ .app{ max-width: 720px; } }
  @media (min-width: 1200px){ .app{ max-width: 960px; } }

  /* ---------- HEADER ---------- */
  header.top{
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(12,13,16,0.86);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .logo{
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-display); font-weight: 600; font-size: 19px;
    letter-spacing: -0.01em; color: var(--text-1);
  }
  .logo .mark{ width: 7px; height: 7px; border-radius: 2px; background: var(--accent); display: inline-block; transform: rotate(45deg); }

  /* ---------- PAGE HEAD ---------- */
  .page-head{ padding: 18px 18px 6px; }
  .page-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .page-summary{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-3);
  }
  .page-summary .dot-sep{ width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
  .page-summary strong{ color: var(--text-2); font-weight: 600; }

  /* ---------- TABS ---------- */
  .tabs{
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 16px 18px 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex: 0 0 auto;
    padding: 8px 15px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    white-space: nowrap;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .tab.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #16130b;
  }

  .tab-panel{ display: none; padding: 18px 0 4px; }
  .tab-panel.active{ display: block; }

  /* ---------- POSTER GRID ---------- */
  .poster-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 10px;
    padding: 0 18px;
  }
  @media (min-width: 640px){ .poster-grid{ grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 900px){ .poster-grid{ grid-template-columns: repeat(5, 1fr); gap: 16px 14px; } }

  .grid-poster{ display: flex; flex-direction: column; gap: 6px; }
  .poster-link{ display: block; }
  .poster{
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: var(--radius-sm);
    background: linear-gradient(150deg, var(--poster-b), var(--poster-a) 65%);
    border: 1px solid var(--border-soft);
    position: relative;
    overflow: hidden;
  }
  .poster::before{
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(200deg, rgba(255,255,255,0.045), transparent 45%);
  }

  .progress-wrap{ display: flex; flex-direction: column; gap: 4px; }
  .progress-track{
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill{ height: 100%; background: var(--accent); border-radius: 2px; }
  .progress-label{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.01em;
  }

  .add-tile{
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
  }
  .add-tile svg{ width: 20px; height: 20px; stroke: var(--text-3); stroke-width: 1.6; }

  /* ---------- CUSTOM LISTS ---------- */
  .custom-wrap{ padding: 0 18px; display: flex; flex-direction: column; gap: 10px; }
  .create-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    border-radius: var(--radius-md);
    border: 1px dashed var(--border);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .list-card{
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 13px 14px;
  }
  .list-icon{
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .list-icon svg{ width: 16px; height: 16px; stroke: var(--accent); stroke-width: 1.8; }
  .list-info{ flex: 1; min-width: 0; }
  .list-name{ font-size: 13.5px; font-weight: 600; color: var(--text-1); }
  .list-count{ font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
  .list-chevron{ width: 14px; height: 14px; stroke: var(--text-3); flex-shrink: 0; }

  /* ---------- TIER LISTS ---------- */
  .tier-wrap{ padding: 0 18px; display: flex; flex-direction: column; gap: 12px; }
  .tier-card{
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 14px;
  }
  .tier-card-title{
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-1);
    margin-bottom: 11px;
  }
  .tier-row{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tier-row:last-child{ margin-bottom: 0; }
  .tier-label{
    width: 20px; height: 20px;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .tier-label.s{ background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); }
  .tier-label.a{ background: rgba(242,241,236,0.09); color: var(--text-1); }
  .tier-label.b{ background: rgba(242,241,236,0.06); color: var(--text-2); }
  .tier-label.c{ background: rgba(242,241,236,0.04); color: var(--text-3); }
  .tier-posters{ display: flex; gap: 5px; flex: 1; overflow: hidden; }
  .tier-mini{
    width: 28px;
    aspect-ratio: 2 / 3;
    border-radius: 4px;
    background: linear-gradient(150deg, var(--poster-b), var(--poster-a) 65%);
    border: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom{
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: rgba(15,16,19,0.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-soft);
  }
  .bottom-inner{ max-width: 560px; margin: 0 auto; display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px){ .bottom-inner{ max-width: 720px; } }
  @media (min-width: 1200px){ .bottom-inner{ max-width: 960px; } }
  .nav-item{ flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; color: var(--text-3); }
  .nav-item svg{ width: 21px; height: 21px; stroke: var(--text-3); stroke-width: 1.7; fill: none; }
  .nav-item span{ font-size: 10.5px; font-weight: 500; }
  .nav-item.active{ color: var(--accent); }
  .nav-item.active svg{ stroke: var(--accent); }
  .nav-item .dot{ width: 3px; height: 3px; margin-top: 1px; border-radius: 50%; }
  .nav-item.active .dot{ background: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="logo"><span class="mark"></span>rankofficial</div>
  </header>

  <div class="page-head">
    <div class="page-title">My Library</div>
    <div class="page-summary">
      <strong>87</strong>&nbsp;Titles
      <span class="dot-sep"></span>
      <strong>12</strong>&nbsp;Watching
      <span class="dot-sep"></span>
      <strong>41</strong>&nbsp;Finished
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="watching">Watching</button>
    <button class="tab" data-tab="planning">Planning</button>
    <button class="tab" data-tab="finished">Finished</button>
    <button class="tab" data-tab="dropped">Dropped</button>
    <button class="tab" data-tab="custom">Custom</button>
    <button class="tab" data-tab="tierlists">Tier Lists</button>
  </div>

  <!-- WATCHING -->
  <div class="tab-panel active" data-panel="watching">
    <div class="poster-grid" id="grid-watching"></div>
  </div>

  <!-- PLANNING -->
  <div class="tab-panel" data-panel="planning">
    <div class="poster-grid" id="grid-planning"></div>
  </div>

  <!-- FINISHED -->
  <div class="tab-panel" data-panel="finished">
    <div class="poster-grid" id="grid-finished"></div>
  </div>

  <!-- DROPPED -->
  <div class="tab-panel" data-panel="dropped">
    <div class="poster-grid" id="grid-dropped"></div>
  </div>

  <!-- CUSTOM -->
  <div class="tab-panel" data-panel="custom">
    <div class="custom-wrap">
      <button class="create-btn">+ Create List</button>
      <div class="list-card">
        <div class="list-icon"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9a2 2 0 0 1 2 2v16l-6.5-4L4 21V5a2 2 0 0 1 2-2z"/></svg></div>
        <div class="list-info">
          <div class="list-name">Comfort Anime</div>
          <div class="list-count">12 titles</div>
        </div>
        <svg class="list-chevron" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
      <div class="list-card">
        <div class="list-icon"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9a2 2 0 0 1 2 2v16l-6.5-4L4 21V5a2 2 0 0 1 2-2z"/></svg></div>
        <div class="list-info">
          <div class="list-name">Must Watch</div>
          <div class="list-count">24 titles</div>
        </div>
        <svg class="list-chevron" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
      <div class="list-card">
        <div class="list-icon"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9a2 2 0 0 1 2 2v16l-6.5-4L4 21V5a2 2 0 0 1 2-2z"/></svg></div>
        <div class="list-info">
          <div class="list-name">Weekend Anime</div>
          <div class="list-count">8 titles</div>
        </div>
        <svg class="list-chevron" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
    </div>
  </div>

  <!-- TIER LISTS -->
  <div class="tab-panel" data-panel="tierlists">
    <div class="tier-wrap">
      <button class="create-btn">+ Create Tier List</button>
      <div class="tier-card">
        <div class="tier-card-title">My Anime Rankings</div>
        <div id="tier-1"></div>
      </div>
      <div class="tier-card">
        <div class="tier-card-title">Best Anime I've Watched</div>
        <div id="tier-2"></div>
      </div>
    </div>
  </div>

</div>

<nav class="bottom">
  <div class="bottom-inner">
    <a class="nav-item" href="rankofficial-homepage.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Home</span>
      <div class="dot"></div>
    </a>
    <a class="nav-item" href="rankofficial-discover.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-4 2-2 4 4-2 2-4z"/></svg>
      <span>Discover</span>
      <div class="dot"></div>
    </a>
    <a class="nav-item active" href="rankofficial-library.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9a2 2 0 0 1 2 2v16l-6.5-4L4 21V5a2 2 0 0 1 2-2z"/></svg>
      <span>Library</span>
      <div class="dot"></div>
    </a>
    <a class="nav-item" href="rankofficial-profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6"/></svg>
      <span>Profile</span>
      <div class="dot"></div>
    </a>
  </div>
</nav>

<script>
  function makeGrid(id, count, withProgress, withAddTile){
    const el = document.getElementById(id);
    if(withAddTile){
      const add = document.createElement('div');
      add.className = 'add-tile';
      add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
      el.appendChild(add);
    }
    for(let i=1;i<=count;i++){
      const wrap = document.createElement('div');
      wrap.className = 'grid-poster';
      const link = document.createElement('a');
      link.className = 'poster-link';
      link.href = 'rankofficial-title.html';
      const p = document.createElement('div');
      p.className = 'poster';
      link.appendChild(p);
      wrap.appendChild(link);
      if(withProgress){
        const total = 12 + (i % 4) * 6;
        const ep = Math.max(1, total - (i % 5) * 2);
        const pct = Math.round((ep/total)*100);
        const prog = document.createElement('div');
        prog.className = 'progress-wrap';
        prog.innerHTML = `
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
          <div class="progress-label">Episode ${ep} / ${total}</div>
        `;
        wrap.appendChild(prog);
      }
      el.appendChild(wrap);
    }
  }

  makeGrid('grid-watching', 11, true, true);
  makeGrid('grid-planning', 14, false, true);
  makeGrid('grid-finished', 17, false, false);
  makeGrid('grid-dropped', 6, false, false);

  function makeTier(id){
    const el = document.getElementById(id);
    const rows = [
      { label: 'S', cls: 's', count: 4 },
      { label: 'A', cls: 'a', count: 6 },
      { label: 'B', cls: 'b', count: 5 },
      { label: 'C', cls: 'c', count: 3 }
    ];
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'tier-row';
      const label = document.createElement('div');
      label.className = 'tier-label ' + r.cls;
      label.textContent = r.label;
      row.appendChild(label);
      const posters = document.createElement('div');
      posters.className = 'tier-posters';
      for(let i=0;i<r.count;i++){
        const m = document.createElement('div');
        m.className = 'tier-mini';
        posters.appendChild(m);
      }
      row.appendChild(posters);
      el.appendChild(row);
    });
  }
  makeTier('tier-1');
  makeTier('tier-2');

  // Tabs
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-panel');
  function activateTab(name){
    const tab = document.querySelector(`.tab[data-tab="${name}"]`);
    if(!tab) return;
    tabs.forEach(t => t.classList.remove('active'));
    panels.forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`.tab-panel[data-panel="${name}"]`).classList.add('active');
    tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
  tabs.forEach(tab => {
    tab.addEventListener('click', () => activateTab(tab.dataset.tab));
  });

  const initialHash = window.location.hash.replace('#', '');
  if(initialHash){ activateTab(initialHash); }
</script>
</body>
</html>
